<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IINO Design</title>

  <!-- Adobe Fonts embed -->
  <link rel="stylesheet" href="https://use.typekit.net/rsf7yot.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* align to top */
      align-items: center;
      margin: 30px 20px; /* add some spacing from top and sides */
      background-color: #ffffff;
      font-family: "gravita-geo-variable", sans-serif;
      color: #222222;
    }
    img {
      max-width: 25%; /* never wider than screen */
      height: auto;
      margin-bottom: 20px;
    }
    p {
      max-width: 33%;       /* roughly 1/3 on large screens */
      width: 90%;           /* scale down on small screens */
      min-width: 200px;     /* don't get too small */
      text-align: center;
      line-height: 1.4;
      font-size: clamp(14px, 2vw, 16px);
      white-space: pre-line;
    }

      /* Media query for mobile screens */
    @media (max-width: 600px) {
      img {
        max-width: 70%;  /* mobile logo size */
      }
    }

    .secondary-image {
      max-width: 30%;      /* scale as desired */
      height: auto;
      margin-top: 0px;    /* space above the image */
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .secondary-image {
        max-width: 80%;    /* make it larger on small screens */
      }
    }

    .section-title {
      font-size: clamp(18px, 3vw, 24px);
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      color: #222222;
      font-variation-settings: 'wght' 400;
    }

    .gallery-image {
      max-width: 30%;
      height: auto;
      margin-top: 20px;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .gallery-image {
        max-width: 80%;
      }
    }

    .caption {
      max-width: 30%;
      text-align: center;
      font-size: clamp(13px, 1.5vw, 15px);
      color: #555;
      margin-top: 0px;
      margin-bottom: 30px;
    }

    /* Mobile adjustment */
    @media (max-width: 600px) {
      .caption {
        max-width: 80%;
      }
    }
    
  </style>
</head>

<body>
  <img src="assets/images/LOGO_iinodesign.png" alt="IINO Design logo">
  <p id="text-content">Loading...</p>
  <img src="assets/images/tuotteetvalmistetturaumanlapissa.png" alt="Second graphic" class="secondary-image">
  <h2 class="section-title">Tuotteet</h2>
  <img src="assets/images/Inastool_v002.jpg" alt="Gallery image 1" class="gallery-image">
  <p class="caption">Ina-jakkara</p>
  <img src="assets/images/IINOstool_v002.jpg" alt="Gallery image 2" class="gallery-image">
  <p class="caption">IINO-jakkara</p>

  <p class="contact-info">
    Ota yhteyttä :)<br>
    Sähköposti: iirokivisto@protonmail.com<br>
    Puhelin: +358 40 757 1896<br>
  </p>
  
  <script>
    fetch('about.txt')
      .then(response => response.text())
      .then(data => {
        document.getElementById('text-content').textContent = data;
      })
      .catch(error => {
        document.getElementById('text-content').textContent = 'Error loading text.';
        console.error(error);
      });
  </script>
</body>
</html>
